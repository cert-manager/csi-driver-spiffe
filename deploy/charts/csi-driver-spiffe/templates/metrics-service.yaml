{{- if .Values.app.approver.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-csi-driver-spiffe.name" . }}-approver-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /*
      "app" is merged in last so .Values.commonLabels cannot override it: the
      ServiceMonitor selects this Service on it, and overriding it would
      silently stop metrics being scraped.
    */}}
    {{- $labels := mergeOverwrite
          (include "cert-manager-csi-driver-spiffe.labels" . | fromYaml)
          (dict "app" (printf "%s-approver" (include "cert-manager-csi-driver-spiffe.name" .)))
    -}}
    {{- toYaml $labels | nindent 4 }}
spec:
  type: {{ .Values.app.approver.metrics.service.type }}
  ports:
    - port: {{ .Values.app.approver.metrics.port }}
      targetPort: {{ .Values.app.approver.metrics.port }}
      protocol: TCP
      name: metrics
  selector:
    app: {{ include "cert-manager-csi-driver-spiffe.name" . }}-approver
{{- end }}
