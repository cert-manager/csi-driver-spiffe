{{- if and .Values.app.approver.metrics.service.enabled .Values.app.approver.metrics.service.servicemonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cert-manager-csi-driver-spiffe.name" . }}-approver
  labels:
    {{- /*
      Merged as one map so no key can be emitted twice, keeping the precedence
      the concatenated form had: "app" stays overridable, while the prometheus
      instance label and the servicemonitor.labels values still win over
      .Values.commonLabels.
    */}}
    {{- $labels := mergeOverwrite
          (dict "app" (printf "%s-approver" (include "cert-manager-csi-driver-spiffe.name" .)))
          (include "cert-manager-csi-driver-spiffe.labels" . | fromYaml)
          (dict "prometheus" .Values.app.approver.metrics.service.servicemonitor.prometheusInstance)
          (.Values.app.approver.metrics.service.servicemonitor.labels | default dict)
    -}}
    {{- toYaml $labels | nindent 4 }}
spec:
  jobLabel: {{ include "cert-manager-csi-driver-spiffe.name" . }}-approver
  selector:
    matchLabels:
      app: {{ include "cert-manager-csi-driver-spiffe.name" . }}-approver
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
  - targetPort: {{ .Values.app.approver.metrics.port }}
    path: "/metrics"
    interval: {{ .Values.app.approver.metrics.service.servicemonitor.interval }}
    scrapeTimeout: {{ .Values.app.approver.metrics.service.servicemonitor.scrapeTimeout }}
{{- end }}
